<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 달빛정원 통합 홍보소</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 650px; padding: 20px; box-sizing: border-box; }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px; padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; text-align: center; }
        p.desc { color: var(--text-sub); font-size: 0.95rem; margin-bottom: 25px; text-align: center; }
        .live-box {
            background: #0f172a; border-radius: 10px; padding: 15px;
            margin-top: 20px; border: 1px solid #334155;
            max-height: 200px; overflow-y: auto;
        }
        .live-item {
            padding: 8px 10px; margin-bottom: 6px;
            background: #1e293b; border-radius: 6px;
            font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🌙 달빛정원 통합 홍보소</h1>
            <p class="desc">디스코드 서버와 실시간으로 연동되는 통합 홍보소입니다.</p>
            
            <h3>📢 실시간 디스코드 채널 현황</h3>
            <div class="live-box" id="channel-list">
                <div class="live-item">✨ 서버 연결 대기 중...</div>
            </div>
        </div>
    </div>

    <script>
        // 웹소켓 연결
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(protocol + window.location.host + '/ws');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.event === 'channel_create') {
                const listContainer = document.getElementById('channel-list');
                
                // 첫 연결 대기 문구 제거
                if (listContainer.innerHTML.includes('서버 연결 대기 중...')) {
                    listContainer.innerHTML = '';
                }

                const newItem = document.createElement('div');
                newItem.className = 'live-item';
                newItem.innerHTML = `🚀 새 채널 생성됨: <strong>#${data.channel_name}</strong>`;
                listContainer.prepend(newItem);
            }
        };
    </script>
</body>
</html>
